<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada | Pablo Barrios</title>
    <meta name="robots" content="noindex">
    <style>
        :root { color-scheme: light dark; }
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 1rem;
            background: #f3f4f6;
            color: #15171c;
            font-family: "Segoe UI", system-ui, sans-serif;
        }
        @media (prefers-color-scheme: dark) {
            body { background: #111317; color: #e9ebef; }
        }
        main { max-width: 32rem; }
        code { font-size: 1.1rem; color: #b2500d; }
        @media (prefers-color-scheme: dark) { code { color: #ffa266; } }
        h1 { font-size: 2rem; margin: 0.5rem 0 1rem; }
        a { color: inherit; font-weight: 600; }
    </style>
</head>
<body>
    <main>
        <code>404 Not Found</code>
        <h1>Esta página no existe.</h1>
        <p>Puede que el enlace esté mal escrito o que la página se haya movido.</p>
        <p><a href="./">Volver al portafolio</a></p>
    </main>
</body>
</html>
